<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #DAF0F7;
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen font-sans">
  <div class="bg-white/30 backdrop-blur-md p-8 rounded-lg shadow-lg w-full max-w-sm text-center">
    <h2 class="text-2xl font-bold mb-6">Login</h2>

    <!-- Flashed Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="mb-4 p-3 rounded text-sm font-semibold flex justify-between items-center
            {% if category == 'error' %}text-red-700 bg-red-100 border border-red-200{% endif %}
            {% if category == 'success' %}text-green-700 bg-green-100 border border-green-200{% endif %}
            {% if category == 'info' %}text-blue-700 bg-blue-100 border border-blue-200{% endif %}
            {% if category == 'logout' %}text-indigo-700 bg-indigo-100 border border-indigo-200{% endif %}">
            {{ message }}
            <button onclick="this.parentElement.remove()" class="text-sm font-bold">✕</button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('login') }}" class="space-y-4">
      <div class="text-left">
        <label for="username" class="block mb-1 font-medium">Username:</label>
        <input type="text" id="username" name="username" placeholder="Enter your username" required
               class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-400">
      </div>

      <div class="text-left">
        <label for="password" class="block mb-1 font-medium">Password:</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required
               class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-400">
      </div>

      <button type="submit" class="w-full py-2 rounded bg-blue-400 hover:bg-blue-500 text-white font-semibold transition">Login</button>
    </form>

    <p class="mt-4 text-sm">
      Don't have an account? <a href="{{ url_for('register') }}" class="text-blue-500 hover:underline">Register</a>
    </p>
    <p class="mt-2 text-sm">
      <a href="{{ url_for('admin_login') }}" class="text-blue-500 hover:underline">Admin Login</a>
    </p>
  </div>
</body>
</html>
