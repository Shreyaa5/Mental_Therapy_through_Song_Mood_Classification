<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ user.name }}'s Profile</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f2f4f8;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 500px;
            margin: 80px auto;
            padding: 30px;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
        }

        .profile-picture {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
            border: 4px solid #2c3e50;
        }

        h2 {
            margin-bottom: 5px;
            font-size: 1.8rem;
            color: #2c3e50;
        }

        p {
            margin-top: 0;
            color: #555;
            font-size: 1rem;
        }

        h3 {
            margin-top: 30px;
            font-size: 1.3rem;
            color: #34495e;
        }

        ul {
            list-style: none;
            padding: 0;
            margin-top: 10px;
            text-align: left;
        }

        ul li {
            background: #ecf0f1;
            padding: 10px;
            margin: 8px 0;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        @media (max-width: 600px) {
            .container {
                margin: 40px 20px;
                padding: 20px;
            }

            h2 {
                font-size: 1.5rem;
            }

            .profile-picture {
                width: 100px;
                height: 100px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="{{ user.profile_picture }}" alt="Profile Picture" class="profile-picture">
        <h2>{{ user.name }}</h2>
        <p>Email: {{ user.email }}</p>

        <h3>Mood History</h3>
        <ul>
            {% for entry in user.mood_history %}
                <li>{{ entry.date }} - {{ entry.mood }}</li>
            {% else %}
                <li>No mood entries found.</li>
            {% endfor %}
        </ul>
    </div>

</body>
</html>
