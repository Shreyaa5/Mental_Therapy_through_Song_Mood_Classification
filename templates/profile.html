<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #e8f5e9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .profile-container {
            background-color: #ffffff;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .profile-container:hover {
            transform: translateY(-5px);
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            background-color: #e0e0e0;
            border-radius: 50%;
            margin: 0 auto 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: #555;
            text-transform: uppercase;
        }

        h2 {
            color: #1a3c34;
            font-weight: 500;
            margin-bottom: 1.5rem;
            font-size: 1.8rem;
        }

        .profile-info {
            margin: 0.8rem 0;
            font-size: 1.1rem;
            color: #333;
        }

        .profile-info strong {
            color: #1a3c34;
            font-weight: 500;
        }

        .home-btn, .logout-btn {
            display: inline-block;
            margin-top: 1rem;
            background-color: #1a3c34;
            color: #ffffff;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 400;
            text-decoration: none;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .home-btn:hover, .logout-btn:hover {
            background-color: #0f2a22;
            transform: scale(1.05);
        }

        .home-btn:active, .logout-btn:active {
            transform: scale(0.95);
        }

        @media (max-width: 480px) {
            .profile-container {
                padding: 1.5rem;
                margin: 1rem;
            }

            h2 {
                font-size: 1.5rem;
            }

            .profile-info {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="profile-container">
        <div class="profile-avatar">{{ user[3][0] }}</div>
        <h2>Welcome, {{ user[3] }}</h2>
        <p class="profile-info"><strong>Username:</strong> {{ user[1] }}</p>
        <p class="profile-info"><strong>Email:</strong> {{ user[2] }}</p>
        <p class="profile-info"><strong>Membership:</strong> {{ user[7] }}</p>
        <a href="{{ url_for('home') }}" class="home-btn">Back to Home</a>
        <form action="{{ url_for('logout') }}" method="post">
            <button type="submit" class="logout-btn">Logout</button>
        </form>
    </div>
</body>
</html>
