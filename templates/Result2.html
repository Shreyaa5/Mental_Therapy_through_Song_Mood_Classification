<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnosis Result</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url("/static/images/resultbg.png");
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            text-align: center;
            padding: 20px;
        }
        .container {
            background-color: white;
            max-width: 600px;
            margin: 100px auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            opacity: 0.9;
        }
        h1, h2 {
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            color: #333;
        }
        input[type="text"], button {
            margin-top: 15px;
            padding: 10px;
            font-size: 16px;
            width: 80%;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Mood Diagnosis Complete</h1>
        <p>Your mood has been identified as <strong>{{ mood }}</strong>.</p>
        <p>Q1 Score: {{ q1 }}</p>
        <!-- <p>Q2 Score: {{ q2 }}</p>
        <p>Q3 Score: {{ q3 }}</p> -->

        <form method="GET" action="{{ url_for('generate_playlist') }}">
            <label for="playlist_name">Enter Playlist Name:</label>
            <input type="text" id="playlist_name" name="playlist_name" required>
        
            <input type="hidden" name="mood" value="{{ mood }}">
        
            <button type="submit">Generate Playlist</button>
        </form>
    </div>
</body>
</html>
